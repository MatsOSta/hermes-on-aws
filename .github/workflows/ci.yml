name: Static CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Bash syntax
        run: |
          bash -n \
            hermes.sh \
            scripts/*.sh \
            scripts/support/*.sh \
            tests/*.sh \
            tests/support/*.sh \
            infrastructure/aws/*.sh

      - name: Check Python helper syntax
        run: python3 -m py_compile scripts/support/deployment-aliases.py

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck \
            hermes.sh \
            scripts/*.sh \
            scripts/support/*.sh \
            tests/*.sh \
            tests/support/*.sh \
            infrastructure/aws/*.sh

      - name: Verify operator dispatch and executable contract
        run: tests/operator_contract_test.sh

      - name: Run credential-free operator regression tests
        run: |
          tests/deployment_alias_test.sh
          tests/operator_safety_test.sh
          tests/saved_plan_state_test.sh
          tests/volume_discovery_test.sh
          tests/install_operator_test.sh

      - name: Run destructive preflight regression tests
        run: tests/destructive_preflight_test.sh

      - name: Run SSM and gateway lifecycle regression tests
        run: |
          tests/ssm_lifecycle_test.sh
          tests/mount_data_volume_test.sh
          tests/gateway_lifecycle_test.sh
          tests/gateway_operator_test.sh

  opentofu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.11.5

      - name: Check formatting
        run: tofu fmt -check -recursive .

      - name: Initialize AWS root without backend
        run: tofu init -backend=false -input=false
        working-directory: infrastructure/aws

      - name: Validate AWS root
        run: tofu validate
        working-directory: infrastructure/aws

      - name: Initialize state bootstrap root without backend
        run: tofu init -backend=false -input=false
        working-directory: infrastructure/bootstrap/state

      - name: Validate state bootstrap root
        run: tofu validate
        working-directory: infrastructure/bootstrap/state

      - name: Initialize greenfield root without backend
        run: tofu init -backend=false -input=false
        working-directory: infrastructure/greenfield

      - name: Validate greenfield root
        run: tofu validate
        working-directory: infrastructure/greenfield

      - name: Run mocked greenfield tests
        run: tofu test
        working-directory: infrastructure/greenfield

      - name: Initialize greenfield state root without backend
        run: tofu init -backend=false -input=false
        working-directory: infrastructure/greenfield-state

      - name: Validate greenfield state root
        run: tofu validate
        working-directory: infrastructure/greenfield-state

      - name: Run mocked greenfield state tests
        run: tofu test
        working-directory: infrastructure/greenfield-state

  policy-as-code:
    runs-on: ubuntu-latest
    env:
      CONFTEST_IMAGE: docker.io/openpolicyagent/conftest@sha256:b451f93ec386c25a4ed5aa4b835605dd4aee693374b619f5dc92374afcb6c296 # v0.68.2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Rego unit tests
        run: |
          docker run --rm \
            --volume "$PWD:/project" \
            --workdir /project \
            "${CONFTEST_IMAGE}" \
            verify --policy policy/terraform

      - name: Enforce subnet policy against AWS root
        run: |
          docker run --rm \
            --volume "$PWD:/project" \
            --workdir /project \
            "${CONFTEST_IMAGE}" \
            test --policy policy/terraform --parser hcl2 infrastructure/aws/*.tf

      - name: Verify greenfield Rego unit tests
        run: |
          docker run --rm \
            --volume "$PWD:/project" \
            --workdir /project \
            "${CONFTEST_IMAGE}" \
            verify --policy policy/greenfield

      - name: Enforce greenfield policy
        run: |
          docker run --rm \
            --volume "$PWD:/project" \
            --workdir /project \
            "${CONFTEST_IMAGE}" \
            test --combine --policy policy/greenfield --parser hcl2 infrastructure/greenfield/*.tf

      - name: Verify greenfield state Rego unit tests
        run: |
          docker run --rm \
            --volume "$PWD:/project" \
            --workdir /project \
            "${CONFTEST_IMAGE}" \
            verify --policy policy/greenfield-state

      - name: Enforce greenfield state policy
        run: |
          docker run --rm \
            --volume "$PWD:/project" \
            --workdir /project \
            "${CONFTEST_IMAGE}" \
            test --combine --policy policy/greenfield-state --parser hcl2 infrastructure/greenfield-state/*.tf

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repository for secrets
        run: gitleaks git --no-banner --redact --exit-code 1

  iac-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Block HIGH and CRITICAL IaC misconfigurations
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: infrastructure/
          version: v0.73.0
          severity: HIGH,CRITICAL
          exit-code: 1
